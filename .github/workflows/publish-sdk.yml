name: Build & Publish SDK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build dist (wheel + sdist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/sdk/python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: libs/sdk/python/dist/*

  publish:
    name: Publish to TestPyPI / PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-collect

      - name: Combine dists
        run: |
          mkdir -p dist
          find dist-collect -type f -name "*.whl" -o -name "*.tar.gz" -exec cp {} dist/ \;

      # Determine whether this tag is a prerelease (contains a hyphen) → publish to TestPyPI
      # Stable tags without hyphen go to PyPI.
      - name: Set publish target
        id: target
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-"* ]]; then
            echo "repo_url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
            echo "secret_name=TEST_PYPI_API_TOKEN" >> $GITHUB_OUTPUT
          else
            echo "repo_url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
            echo "secret_name=PYPI_API_TOKEN" >> $GITHUB_OUTPUT
          fi

      - name: Publish with Twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets[steps.target.outputs.secret_name] }}
          REPO_URL: ${{ steps.target.outputs.repo_url }}
        run: |
          python -m pip install --upgrade twine
          twine upload --repository-url "${REPO_URL}" dist/* --skip-existing
